[project]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS Core: local AI orchestration server (API, LLM routing, streaming) for the JARVIS assistant."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
